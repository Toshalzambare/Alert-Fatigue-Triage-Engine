apiVersion: v1
kind: Service
metadata:
  name: mcp
  labels:
    app: triage
    tier: tool-server
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: triage
    tier: tool-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app: triage
    tier: tool-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage
      tier: tool-server
  template:
    metadata:
      labels:
        app: triage
        tier: tool-server
    spec:
      containers:
        - name: mcp
          image: gcr.io/YOUR_PROJECT_ID/triage-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: triage-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
